<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>MeghKobita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Books, poems, songs and films from every language, matched to your weather and mood.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Serif+Devanagari:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+TC:wght@400&family=Noto+Serif+Tamil:wght@400;600&family=Noto+Serif+Malayalam:wght@400&family=Noto+Serif+Telugu:wght@400&family=Noto+Serif+Kannada:wght@400&family=Noto+Serif+Gurmukhi:wght@400&family=Noto+Serif+Thai:wght@400&family=Noto+Serif+Georgian:wght@400&family=Noto+Serif+Ethiopic:wght@400&family=Noto+Serif+Gujarati:wght@400&display=swap">
<style>
/* Layout: a framed window onto the sky above reading-room shelves; each medium gets its own shelf form
   (tracklist, paper slips, cloth covers, posters). */
:root{
  --bg:#f5efe3;          /* warm ivory */
  --paper:#fbf7ee;       /* cream */
  --ink:#24272a;         /* charcoal */
  --muted:#686960;
  --line:#e0d7c6;
  --blue:#46657c;        /* muted blue */
  --green:#2c5844;       /* forest green */
  --terra:#ad5130;       /* terracotta */
  --chip:#ece4d4;
  --focus:#46657c;
  --shadow:0 1px 0 rgba(36,39,42,.04), 0 10px 30px -18px rgba(36,39,42,.35);
  --f-display:"Gloock","Noto Serif Bengali","Noto Serif Devanagari",Georgia,serif;
  --f-body:"Newsreader","Noto Serif Bengali","Noto Serif Devanagari","Noto Naskh Arabic","Noto Serif JP","Noto Serif KR","Noto Serif SC","Noto Serif Tamil","Noto Serif Malayalam",Georgia,serif;
  --f-meta:"IBM Plex Mono","Noto Sans Bengali","Noto Serif Devanagari",ui-monospace,Menlo,monospace;
  --f-bn:"Noto Serif Bengali","Newsreader",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141617; --paper:#1c1f21; --ink:#ebe5d8; --muted:#a19c90; --line:#2e3235; --blue:#93b3cb; --green:#86bb9f; --terra:#e3906b; --chip:#25292c; --focus:#93b3cb;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141617; --paper:#1c1f21; --ink:#ebe5d8; --muted:#a19c90; --line:#2e3235; --blue:#93b3cb; --green:#86bb9f; --terra:#e3906b; --chip:#25292c; --focus:#93b3cb;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang="bn"] body{font-family:var(--f-bn),var(--f-body);font-size:16px}
html[lang="hi"] body{font-family:"Noto Serif Devanagari",var(--f-body);font-size:16px}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
p{margin:0}
[lang="ja"]{font-family:"Noto Serif JP",var(--f-body)}
[lang="ko"]{font-family:"Noto Serif KR",var(--f-body)}
[lang="zh"]{font-family:"Noto Serif SC",var(--f-body)}
[lang="zh-Hant"]{font-family:"Noto Serif TC","Noto Serif SC",var(--f-body)}
[lang="ar"],[lang="fa"],[lang="ur"]{font-family:"Noto Naskh Arabic",var(--f-body)}
[lang="ta"]{font-family:"Noto Serif Tamil",var(--f-body)}
[lang="ml"]{font-family:"Noto Serif Malayalam",var(--f-body)}
[lang="bn"],[lang="as"]{font-family:var(--f-bn)}
[lang="hi"],[lang="mr"],[lang="sa"],[lang="ne"]{font-family:"Noto Serif Devanagari",var(--f-body)}
[lang="te"]{font-family:"Noto Serif Telugu",var(--f-body)}
[lang="kn"]{font-family:"Noto Serif Kannada",var(--f-body)}
[lang="pa"]{font-family:"Noto Serif Gurmukhi",var(--f-body)}
[lang="th"]{font-family:"Noto Serif Thai",var(--f-body)}
[lang="ka"]{font-family:"Noto Serif Georgian",var(--f-body)}
[lang="am"]{font-family:"Noto Serif Ethiopic",var(--f-body)}
[lang="gu"]{font-family:"Noto Serif Gujarati",var(--f-body)}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Header ─────────────────────────────────────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.logo b{font-family:var(--f-bn);font-weight:700;font-size:1.55rem;letter-spacing:.01em;line-height:1}
.logo span{font-family:var(--f-meta);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:.92rem}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--chip)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.langs button{border:0;background:none;padding:3px 9px;border-radius:999px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){ .top .wrap{flex-wrap:wrap;gap:8px 12px} .nav{order:3;flex-basis:100%} .logo span{display:none} .langs{margin-left:auto} }

main{padding-block:22px 64px}

/* ── Sky (weather hero) ─────────────────────────── */
.sky{position:relative;border-radius:22px;overflow:hidden;color:var(--sky-ink);background:linear-gradient(170deg,var(--sky1),var(--sky2));box-shadow:var(--shadow);isolation:isolate}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sky::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--sky-scrim),transparent 70%);pointer-events:none}
.sky-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px 40px;padding:30px 32px 22px}
.sky-place{font-family:var(--f-meta);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;font-family:var(--f-meta);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.sky-cond{font-family:var(--f-display);font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.04;margin-top:10px}
html[lang="bn"] .sky-cond,html[lang="hi"] .sky-cond{font-weight:700;line-height:1.2}
.sky-stats{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;font-variant-numeric:tabular-nums}
.sky-stats .temp{font-family:var(--f-display);font-size:2.2rem;line-height:1}
.sky-stats span{font-size:.92rem;opacity:.9}
.sky-note{margin-top:12px;font-size:.88rem;opacity:.88;max-width:46ch}
.sky-line{align-self:center}
.sky-line blockquote{margin:0;font-family:var(--f-display);font-size:clamp(1.45rem,2.9vw,2.25rem);line-height:1.22;text-wrap:balance}
html[lang="bn"] .sky-line blockquote{font-family:var(--f-bn);font-weight:600;line-height:1.45}
html[lang="hi"] .sky-line blockquote{font-family:"Noto Serif Devanagari",serif;font-weight:600;line-height:1.45}
.sky-line cite{display:block;margin-top:10px;font-style:normal;font-family:var(--f-meta);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.sky-tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sky-tools form{display:flex;gap:6px;flex:1 1 280px;max-width:420px}
.sky-tools input{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:10px;padding:8px 12px}
.sky[data-ink="dark"] .sky-tools input{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.25)}
.sky-tools input::placeholder{color:inherit;opacity:.7}
.gl{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:inherit;border-radius:10px;padding:8px 13px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.sky[data-ink="dark"] .gl{background:rgba(255,255,255,.38);border-color:rgba(0,0,0,.2)}
.gl:hover{background:rgba(255,255,255,.28)}
.sky-skies{grid-column:1/-1;border-top:1px solid color-mix(in srgb,var(--sky-ink) 25%,transparent);padding-top:14px}
.sky-skies h2{font-family:var(--f-meta);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.skychips{display:flex;flex-wrap:wrap;gap:6px}
.skychips button{border:1px solid color-mix(in srgb,var(--sky-ink) 35%,transparent);background:transparent;color:inherit;border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.skychips button[aria-pressed="true"]{background:var(--sky-ink);color:var(--sky2);border-color:var(--sky-ink)}
@media (max-width:820px){ .sky-in{grid-template-columns:1fr;padding:22px 18px 18px;gap:18px} }

/* ── Mood + controls ───────────────────────────── */
.panel{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel h2{font-family:var(--f-display);font-size:1.5rem}
html[lang="bn"] .panel h2,html[lang="hi"] .panel h2{font-weight:700}
.hint{color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.92rem;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
.mood-row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lbl{font-family:var(--f-meta);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.free{display:flex;gap:6px;flex:1 1 300px}
.field{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
.free .field{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:.9rem;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fffaf3}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.readout{margin-top:10px;font-size:.88rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
select.field{padding-right:28px}

/* ── Shelves ───────────────────────────────────── */
.shelf{margin-top:46px}
.shelf-head{display:flex;justify-content:space-between;align-items:end;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:18px}
.shelf-head h2{font-family:var(--f-display);font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1}
html[lang="bn"] .shelf-head h2,html[lang="hi"] .shelf-head h2{font-weight:700;line-height:1.3}
.shelf-head .kick{font-family:var(--f-meta);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);display:block;margin-bottom:6px}
.shelf-head p{color:var(--muted);font-size:.92rem;margin-top:4px}
.seeall{font-size:.9rem;white-space:nowrap;text-decoration:none;border-bottom:1px solid currentColor}

.orig{display:block}
.tr{display:block;font-style:italic;color:var(--muted);font-size:.86em}
.en{display:block;color:var(--muted);font-size:.86em}
.meta{font-family:var(--f-meta);font-size:.72rem;letter-spacing:.03em;color:var(--muted);line-height:1.5}
.why{font-size:.9rem;line-height:1.45;color:var(--ink);opacity:.86;margin-top:6px}
.ttl{all:unset;cursor:pointer;display:block}
.ttl:hover .orig{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.ttl:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.heart{border:1px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.heart svg{width:16px;height:16px}
.heart[aria-pressed="true"]{color:var(--terra);border-color:var(--terra)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.lk{font-size:.82rem;text-decoration:none;color:var(--blue);display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.lk:hover{border-color:var(--blue)}
.lk small{color:var(--muted);font-family:var(--f-meta);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase}

/* Tracklist */
.tracks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 34px}
.track{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.track-n{font-family:var(--f-meta);font-size:.8rem;color:var(--terra);padding-top:4px;font-variant-numeric:tabular-nums}
.track .ttl .orig{font-size:1.12rem;line-height:1.3}
.energy{display:inline-flex;gap:2px;align-items:end;height:14px;margin-right:4px}
.energy b{width:3px;background:var(--line);border-radius:1px}
.energy b.on{background:var(--green)}
@media (max-width:820px){ .tracks{grid-template-columns:1fr} }

/* Poem slips */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 18px 14px;display:flex;flex-direction:column;min-width:0;position:relative}
.slip::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px;pointer-events:none;opacity:.7}
.slip .ttl .orig{font-size:1.3rem;line-height:1.3}
.slip .ex{margin:12px 0 4px;font-size:1.02rem;line-height:1.6;white-space:pre-line;color:var(--ink)}
.slip .ex::before{content:"";display:block;width:24px;height:1px;background:var(--terra);margin-bottom:10px}
.slip .grow{flex:1}
.rights{font-family:var(--f-meta);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-top:8px}
.rights.c{color:var(--terra)}

/* Book covers */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.book{min-width:0}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:3px 8px 8px 3px;position:relative;overflow:hidden;color:var(--c-ink);background:var(--c-bg);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px 14px 26px;cursor:pointer;border:0;text-align:left;width:100%}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.18);box-shadow:inset -1px 0 0 rgba(255,255,255,.12)}
.cover .c-title{font-size:1.45rem;line-height:1.22;overflow-wrap:anywhere}
.cover .c-by{font-family:var(--f-meta);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cover .c-rule{height:1px;background:currentColor;opacity:.4;margin:8px 0}
.book .info{margin-top:10px}
.book .info .orig{font-size:1rem}

/* Posters */
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px}
.film{min-width:0;display:flex;flex-direction:column}
.poster{aspect-ratio:2/3;max-width:100%;width:100%;border:0;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;color:var(--p-ink);background:var(--p-bg);display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px;text-align:left;box-shadow:var(--shadow)}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 80% 0%,var(--p-glow),transparent 60%);pointer-events:none}
.poster > *{position:relative;z-index:1}
.p-top{display:flex;justify-content:space-between;font-family:var(--f-meta);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;gap:6px}
.p-title{font-size:1.5rem;line-height:1.12;overflow-wrap:anywhere}
.p-title[lang="en"],.p-title[lang="fr"],.p-title[lang="es"],.p-title[lang="it"],.p-title[lang="pt"],.p-title[lang="tr"]{font-family:var(--f-display)}
.p-bot{font-family:var(--f-meta);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9;border-top:1px solid currentColor;padding-top:6px;line-height:1.5}
.film .info{margin-top:10px}
.film .info .orig{font-size:.98rem}

/* Mixed minis */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mini{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mini .sw{aspect-ratio:1;border-radius:8px;background:var(--p-bg);color:var(--p-ink);display:grid;place-items:center;font-family:var(--f-meta);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;border:0;cursor:pointer;padding:4px;text-align:center}
.mini .ttl .orig{font-size:1.02rem;line-height:1.3}
.tkind{font-family:var(--f-meta);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}

/* ── Category pages ────────────────────────────── */
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.pagehead h1{font-family:var(--f-display);font-size:clamp(2.2rem,5vw,3.6rem);line-height:1}
html[lang="bn"] .pagehead h1,html[lang="hi"] .pagehead h1{font-weight:700;line-height:1.25}
.ctxbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.ctxbar .sw{width:12px;height:12px;border-radius:50%;background:linear-gradient(var(--sky1),var(--sky2));display:inline-block;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px;align-items:end}
.filters .ctl{flex:1 1 150px;max-width:220px}
.filters .ctl.q{flex:2 1 220px;max-width:340px}
.count{font-family:var(--f-meta);font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-bottom:12px}
.more{display:flex;justify-content:center;margin-top:26px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* ── Evening ───────────────────────────────────── */
.eve-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eve-form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;background:var(--bg)}
.plan{margin-top:28px;display:grid;gap:0;border-left:2px solid var(--ink);margin-left:8px}
.step{position:relative;padding:4px 0 26px 26px}
.step::before{content:"";position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--terra)}
.step-time{font-family:var(--f-meta);font-size:.74rem;letter-spacing:.08em;color:var(--terra);font-variant-numeric:tabular-nums}
.step h3{font-family:var(--f-display);font-size:1.35rem;margin:2px 0 10px}
html[lang="bn"] .step h3,html[lang="hi"] .step h3{font-weight:700}
.step .minis{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.note{font-size:.88rem;color:var(--muted);margin-top:10px}
.warn{font-size:.9rem;color:var(--terra)}

/* ── Collection & settings ─────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--terra)}
.rows{display:grid;gap:0}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) auto;gap:10px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .ttl .orig{font-size:1.05rem}
.row-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;cursor:pointer;color:var(--line);font-size:1.15rem;padding:0 1px;line-height:1}
.stars button.on{color:var(--terra)}
.moodtags{display:flex;flex-wrap:wrap;gap:4px}
.moodtags span{font-size:.74rem;background:var(--chip);border-radius:999px;padding:1px 8px}

.listcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--paper);margin-bottom:14px}
.listcard h3{font-family:var(--f-display);font-size:1.25rem}
.listcard ol{margin:10px 0 0;padding-left:1.3em}
.listcard li{padding:3px 0}
.newlist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{font-family:var(--f-display);font-size:1.25rem;margin-bottom:10px}
html[lang="bn"] .card h2,html[lang="hi"] .card h2{font-weight:700}
.card .chips{margin-top:6px}
.card + .card{margin:0}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 3.2rem;gap:10px;align-items:center;padding:4px 0}
.wrow output{font-family:var(--f-meta);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.sub{margin-top:14px}
.prose{font-size:.94rem;color:var(--ink);opacity:.9;max-width:65ch}

/* ── Dialog ────────────────────────────────────── */
dialog{border:0;padding:0;border-radius:18px;background:var(--paper);color:var(--ink);max-width:min(860px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,22,23,.55);backdrop-filter:blur(2px)}
.dlg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0}
.dlg-art{padding:18px;background:var(--bg);border-right:1px solid var(--line)}
.dlg-art .poster,.dlg-art .cover{width:100%}
.dlg-art .sqr{aspect-ratio:1;border-radius:10px;background:var(--p-bg);color:var(--p-ink);display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.dlg-body{padding:22px 24px 24px;min-width:0}
.dlg-x{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;line-height:1}
.dlg-body h2{font-size:1.9rem;line-height:1.2;padding-right:30px}
.dlg-body h2 .tr,.dlg-body h2 .en{font-size:1rem;margin-top:4px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:16px 0;font-size:.92rem}
.facts dt{font-family:var(--f-meta);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.box h3{font-family:var(--f-meta);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.linklist{display:flex;flex-direction:column;gap:8px}
.linklist a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:6px;flex-wrap:wrap}
.linklist a small{color:var(--muted);font-family:var(--f-meta);font-size:.66rem;letter-spacing:.05em}
.dex{white-space:pre-line;font-size:1.15rem;line-height:1.65}
@media (max-width:720px){ .dlg{grid-template-columns:1fr} .dlg-art{border-right:0;border-bottom:1px solid var(--line);display:flex;justify-content:center} .dlg-art > *{max-width:180px} .dlg-body{padding:18px} }

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding-block:20px 30px;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

    } else if (kind === 'sunny' || kind === 'wintermorn'){
      const sx = w*0.82, sy = h*(kind === 'sunny' ? 0.18 : 0.62), sr = Math.min(w,h)*(kind === 'sunny' ? 0.9 : 0.6);

        g.fillStyle = `rgba(255,255,255,${0.25 + p.s*0.35})`; g.beginPath(); g.arc(p.x*w, p.y*h, (0.8+p.s*1.6)*dpr, 0, 6.28); g.fill(); });
    } else { // fog, cloudy

    }

  }

}

function detectLang(s){
  if (/[぀-ヿ]/.test(s)) return 'ja'; if (/[가-힯]/.test(s)) return 'ko'; if (/[一-鿿]/.test(s)) return 'zh';
  if (/[ঀ-৿]/.test(s)) return 'bn'; if (/[ऀ-ॿ]/.test(s)) return 'hi'; if (/[؀-ۿ]/.test(s)) return 'ar';
  if (/[\u0b80-\u0bff]/.test(s)) return 'ta'; if (/[\u0c00-\u0c7f]/.test(s)) return 'te'; if (/[\u0c80-\u0cff]/.test(s)) return 'kn'; if (/[\u0a00-\u0a7f]/.test(s)) return 'pa'; if (/[ഀ-ൿ]/.test(s)) return 'ml'; if (/[\u0400-\u04ff]/.test(s)) return 'ru'; if (/[\u0370-\u03ff]/.test(s)) return 'el'; if (/[\u0e00-\u0e7f]/.test(s)) return 'th'; if (/[\u10a0-\u10ff]/.test(s)) return 'ka'; if (/[\u1200-\u137f]/.test(s)) return 'am'; if (/[\u0a80-\u0aff]/.test(s)) return 'gu'; return 'en';
}
function langAttr(str, it){
  let d = detectLang(str);
  if (d === 'ar' && ['fa','ur'].includes(it.lang)) d = it.lang;
  if (d === 'zh' && it.lang === 'yue') d = 'zh-Hant';
  if (d === 'zh' && it.lang === 'ja') d = 'ja';
  if (d === 'hi' && ['mr','sa'].includes(it.lang)) d = it.lang;
  if (d === 'ar' && it.lang === 'pa') d = 'ur';
  if (d === 'bn' && it.lang === 'as') d = 'as';
  if (d === 'hi' && it.lang === 'ne') d = 'ne';
  if (d === 'en' && ['vi','id','sw','zu','xh','ms','tl','haw','mi','hu','is','sn','man'].includes(it.lang)) d = it.lang;
  if (d === 'ru' && it.lang === 'uk') d = 'uk';
  if (d === 'en' && ['fr','es','it','pt','tr','de','sv','nb','pl'].includes(it.lang)) d = it.lang;
  return d;
}
function titleHtml(it){
  const o = `<span class="orig" lang="${langAttr(it.title, it)}" dir="auto">${esc(it.title)}</span>`;
  const tr = it.tr && it.tr !== it.title ? `<span class="tr">${esc(it.tr)}</span>` : '';
  const en = it.en && it.en !== it.title && it.en !== it.tr ? `<span class="en" lang="en">${esc(it.en)}</span>` : '';
  switch (S.titleMode){
    case 'original': return o;
    case 'translit': return o + tr;
    case 'translation': return en ? `<span class="orig" lang="en">${esc(it.en)}</span><span class="tr" lang="${langAttr(it.title, it)}" dir="auto">${esc(it.title)}</span>` : o + tr;
    default: return o + tr + en;

}

/* ── Home ──────────────────────────────────────────────────── */
function shelf(id, title, sub, body, see){
  return `<section class="shelf" aria-labelledby="sh-${id}"><div class="shelf-head"><div><span class="kick">${esc(L(WEATHER[S.weather]))}${S.moods.length ? ' · ' + S.moods.map(m => esc(L(MOODS[m]))).join(', ') : ''}</span><h2 id="sh-${id}">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${see ? `<a class="seeall" href="#${see}">${t('seeAll')} →</a>` : ''}</div>${body}</section>`;
}
function homeHtml(){
  const c = ctx(), used = new Set(), pool = CATALOGUE.filter(it => passesContext(it, c));
  const take = (type, n) => { const r = rank(pool.filter(it => it.t === type), c, n, { exclude:used }); r.forEach(x => used.add(x.it.id)); return r; };
  const show = k => S.ctlType === 'all' || S.ctlType === k;
  let html = heroHtml() + moodPanel(false);
  const shown = [];
  if (show('song')){ const r = take('song', 6); shown.push(...r); html += shelf('m', t('s_music'), '', r.length ? `<ol class="tracks">${r.map((x,i) => trackHtml(x,i,c)).join('')}</ol>` : emptyMsg(), 'music'); }
  if (show('poem')){ const r = take('poem', 4); shown.push(...r); html += shelf('p', t('s_poetry'), '', r.length ? `<div class="slips">${r.map(x => slipHtml(x,c)).join('')}</div>` : emptyMsg(), 'poetry'); }
  if (show('book')){ const r = take('book', 5); shown.push(...r); html += shelf('b', t('s_books'), '', r.length ? `<div class="covers">${r.map(x => bookHtml(x,c)).join('')}</div>` : emptyMsg(), 'books'); }
  if (show('movie')){ const r = take('movie', 6); shown.push(...r); html += shelf('f', t('s_movies'), '', r.length ? `<div class="posters">${r.map(x => filmHtml(x,c)).join('')}</div>` : emptyMsg(), 'movies'); }
  const typeOk = it => show(it.t);
  const foreign = rank(pool.filter(it => typeOk(it) && !S.understood.includes(it.lang) && it.lang !== 'zxx'), c, 4, { exclude:used });
  foreign.forEach(x => used.add(x.it.id));
  if (foreign.length) html += shelf('c', t('s_culture'), t('s_culture_sub'), `<div class="minis">${foreign.map(x => miniHtml(x,c)).join('')}</div>`);
  const c2 = { ...c, weights:{ mood:30, weather:0, pref:5, season:5, time:0, disc:60 }, seed:(S.seed || 0) + 7 };
  const odd = rank(pool.filter(it => typeOk(it) && !it.w.includes(S.weather)), c2, 4, { exclude:used });
  if (odd.length) html += shelf('u', t('s_unexpected'), t('s_unexpected_sub'), `<div class="minis">${odd.map(x => miniHtml({ ...x, r:scoreItem(x.it, c) }, c, 'discover')).join('')}</div>`);
  recordHistory(shown.concat(foreign, odd));
  return html;
}
const emptyMsg = () => `<div class="empty">${t('noResults')}</div>`;
function recordHistory(list){
  const key = [S.weather, S.moods.slice().sort().join('+'), S.intensity, S.seed].join('|');
  const last = S.history[0];
  if (last && last.key === key) return;
  list.forEach(x => { S.seen[x.it.id] = (S.seen[x.it.id] || 0) + 1; });
  S.history.unshift({ key, at:Date.now(), weather:S.weather, moods:S.moods.slice(), intensity:S.intensity, ids:list.slice(0, 8).map(x => x.it.id) });
  S.history = S.history.slice(0, 40); persist();
}

/* ── Category pages ────────────────────────────────────────── */
const decade = y => y ? Math.floor(y/10)*10 : null;
function catHtml(v){
  const type = VIEW_TYPE[v], f = F[v] || (F[v] = { q:'', lang:'all', genre:'all', decade:'all', page:1 });
  const c = ctx();
  const base = CATALOGUE.filter(it => it.t === type && passesContext(it, { ...c, ctlTime:0 }));
  const opts = key => [...new Set(base.map(key).filter(Boolean))].sort();
  const sel = (k, label, all, values, fmt = x => x) => `<label class="ctl"><span class="lbl">${label}</span><select class="field" data-ch="f:${k}" id="f-${v}-${k}"><option value="all">${all}</option>${values.map(x => `<option value="${esc(x)}" ${String(f[k]) === String(x) ? 'selected' : ''}>${esc(fmt(x))}</option>`).join('')}</select></label>`;
  let ctrls = `<label class="ctl q"><span class="lbl">${t('filters')}</span><input class="field" type="search" data-in="f:q" id="f-${v}-q" placeholder="${t('searchCat')}" value="${esc(f.q)}"></label>`;
  ctrls += sel('lang', t('f_language'), t('allLangs'), opts(x => x.lang), langName);
  if (type === 'song'){
    ctrls += sel('genre', t('f_genre'), t('allGenres'), opts(x => x.genre));
    ctrls += sel('vocal', t('vocals'), t('v_any'), ['1','0'], x => x === '1' ? t('v_vocal') : t('v_inst'));
    ctrls += sel('energy', t('energy'), t('e_any'), ['low','mid','high'], x => t('e_' + x));
    ctrls += sel('decade', t('f_year'), t('allDecades'), opts(x => decade(x.year)), d => yr(d) + 's');
  } else if (type === 'poem'){
    ctrls += sel('genre', t('f_form'), t('allForms'), opts(x => x.form));
  } else if (type === 'book'){
    ctrls += sel('genre', t('f_genre'), t('allGenres'), opts(x => x.genre));
    ctrls += sel('len', t('f_length'), t('allLengths'), ['vshort','short','medium','long','vlong'], x => t('len_' + x));
    ctrls += sel('readable', t('readLang'), t('rl_any'), ['mine'], () => t('rl_mine'));
    ctrls += sel('decade', t('f_year'), t('allDecades'), opts(x => decade(x.year)), d => yr(d) + 's');
  } else {
    ctrls += sel('country', t('f_country'), t('allCountries'), opts(x => x.country));
    ctrls += sel('director', t('f_director'), t('allDirectors'), opts(x => x.by));
    ctrls += sel('genre', t('f_genre'), t('allGenres'), opts(x => x.genre));
    ctrls += sel('runtime', t('runtime'), t('r_any'), ['short','mid','long'], x => t('r_' + x));
    ctrls += sel('mtype', t('mtype'), t('mt_any'), ['feature','animation','documentary'], x => t('mt_' + x));
    ctrls += sel('subs', t('subs'), t('subs_any'), ['need','none'], x => t('subs_' + x));
    ctrls += sel('decade', t('f_year'), t('allDecades'), opts(x => decade(x.year)), d => yr(d) + 's');
  }
  const q = f.q.trim().toLowerCase();
  const list = base.filter(it => {
    if (q && ![it.title, it.tr, it.en, it.by, it.comp, it.alt].filter(Boolean).join(' ').toLowerCase().includes(q)) return false;
    if (f.lang !== 'all' && it.lang !== f.lang) return false;
    if (f.genre && f.genre !== 'all' && (it.genre || it.form) !== f.genre) return false;
    if (f.decade && f.decade !== 'all' && String(decade(it.year)) !== String(f.decade)) return false;
    if (f.vocal && f.vocal !== 'all' && String(it.vocal) !== f.vocal) return false;
    if (f.energy && f.energy !== 'all'){ const e = it.energy||2; if ((f.energy === 'low' && e > 2) || (f.energy === 'mid' && e !== 3) || (f.energy === 'high' && e < 4)) return false; }
    if (f.len && f.len !== 'all' && it.len !== f.len) return false;
    if (f.readable === 'mine' && !(S.understood.includes(it.lang) || (it.enEd && S.understood.includes('en')))) return false;
    if (f.country && f.country !== 'all' && it.country !== f.country) return false;
    if (f.director && f.director !== 'all' && it.by !== f.director) return false;
    if (f.runtime && f.runtime !== 'all'){ if (!it.rt) return false; if ((f.runtime === 'short' && it.rt >= 100) || (f.runtime === 'mid' && (it.rt < 100 || it.rt > 130)) || (f.runtime === 'long' && it.rt <= 130)) return false; }
    if (f.mtype && f.mtype !== 'all' && it.mtype !== f.mtype) return false;
    if (f.subs === 'need' && (S.understood.includes(it.lang) || it.lang === 'zxx')) return false;
    if (f.subs === 'none' && !(S.understood.includes(it.lang) || it.lang === 'zxx')) return false;
    return true;
  });
  const ranked = rank(list, c, list.length);
  const page = ranked.slice(0, f.page * 12);
  const body = !page.length ? `<div class="empty">${t('noResults')} <button class="btn" data-act="resetf">${t('reset')}</button></div>`
    : type === 'song' ? `<ol class="tracks">${page.map((x,i) => trackHtml(x,i,c)).join('')}</ol>`
    : type === 'poem' ? `<div class="slips">${page.map(x => slipHtml(x,c)).join('')}</div>`
    : type === 'book' ? `<div class="covers">${page.map(x => bookHtml(x,c)).join('')}</div>`
    : `<div class="posters">${page.map(x => filmHtml(x,c)).join('')}</div>`;
  return `<div class="pagehead"><h1>${t('nav_' + v)}</h1></div>${ctxBar()}
    <div class="filters">${ctrls}</div><p class="count">${nf(list.length)} ${t('results')}</p>${body}
    ${ranked.length > page.length ? `<div class="more"><button class="btn" data-act="more">${t('showMore')}</button></div>` : ''}`;
}
function ctxBar(){
  const sky = SKY[S.weather];
  return `<div class="ctxbar"><span class="sw" style="--sky1:${sky[0]};--sky2:${sky[1]}" aria-hidden="true"></span><span>${t('ctxNow')}: <b>${esc(L(WEATHER[S.weather]))}</b>${S.moods.length ? ' · ' + S.moods.map(m => esc(L(MOODS[m]))).join(', ') : ''}</span>

      <div class="ctl"><span class="lbl">${t('company')}</span>${seg('company', [['alone',t('c_alone')],['friends',t('c_friends')],['family',t('c_family')]])}</div>
      <div class="ctl"><span class="lbl">${t('eveTime')}</span>${seg('minutes', [[60,t('h1')],[120,t('h2')],[180,t('h3')],[240,t('h4')]])}</div>
      <div class="ctl"><span class="lbl">${t('intensity')}</span>${seg('intensity', [[1,t('int1')],[2,t('int2')],[3,t('int3')]])}</div>
      <label class="ctl"><span class="lbl">${t('ctlLang')}</span><select class="field" data-ch="ctlLang" id="eve-lang">${langOptions(S.ctlLang, 'any', `<option value="mine" ${S.ctlLang === 'mine' ? 'selected' : ''}>${t('myLangs')}</option>`).replace(`value="any">`, `value="any" ${S.ctlLang === 'any' ? 'selected' : ''}>`)}</select></label>
      <div class="ctl full"><span class="lbl">${t('include')}</span><div class="checks">${['poem','song','movie','book'].map(chk).join('')}</div></div>
      <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="buildeve">${evePlan ? t('rebuild') : t('build')}</button></div>
    </div>${moodPanel(true)}${plan}`;
}
function runEvening(reseed){
  if (reseed) S.seed = (S.seed || 0) + 1;
  const E = S.eve;
  evePlan = buildEvening(CATALOGUE, ctx(), { company:E.company, minutes:+E.minutes, intensity:+E.intensity, inc:E.inc });
}

/* ── Collection ────────────────────────────────────────────── */
function collectionHtml(){
  const tab = S.colTab;
  const tabs = [['saved',t('favourites')],['lists',t('lists')],['history',t('history')]].map(([k,l]) => `<button role="tab" data-act="coltab" data-v="${k}" aria-selected="${tab === k}">${l}</button>`).join('');
  let body = '';
  if (tab === 'saved'){
    const ids = Object.keys(S.saved).filter(id => BY_ID[id]).sort((a,b) => S.saved[b].at - S.saved[a].at);
    body = !ids.length ? `<div class="empty">${t('colEmpty')}</div>` : TYPES.map(type => {
      const rows = ids.filter(id => BY_ID[id].t === type); if (!rows.length) return '';
      return `<h2 class="lbl" style="margin:22px 0 4px">${t('t_' + type)} · ${nf(rows.length)}</h2><div class="rows">${rows.map(id => {
        const it = BY_ID[id], sv = S.saved[id];
        const status = type === 'book' ? ['planned','reading','completed'] : type === 'movie' ? ['watchlist','watched'] : null;
        return `<div class="row"><div>${ttl(it)}<div class="meta">${metaLine(it)}</div></div>
          <div><span class="lbl">${t('moodAtSave')}</span><div class="moodtags">${esc(L(WEATHER[sv.weather] || {}))  ? `<span>${esc(L(WEATHER[sv.weather] || {}))}</span>` : ''}${(sv.moods||[]).map(m => `<span>${esc(L(MOODS[m]))}</span>`).join('')}</div></div>
          <div class="row-ctl"><span class="stars" role="group" aria-label="${t('rate')}">${[1,2,3,4,5].map(n => `<button data-act="rate" data-id="${id}" data-v="${n}" class="${sv.rating >= n ? 'on' : ''}" aria-label="${n}/5">★</button>`).join('')}</span>
          ${status ? `<select class="field" data-ch="status" data-id="${id}" aria-label="${t('status')}"><option value="">${t('st_none')}</option>${status.map(s => `<option value="${s}" ${sv.status === s ? 'selected' : ''}>${t('st_' + s)}</option>`).join('')}</select>` : ''}
          <button class="btn ghost" data-act="unsave" data-id="${id}">${t('remove')}</button></div></div>`;
      }).join('')}</div>`;
    }).join('');
  } else if (tab === 'lists'){
    body = `<form class="newlist" data-form="newlist"><label class="sr" for="nl-name">${t('listName')}</label><input class="field" id="nl-name" name="name" placeholder="${t('listName')}" required>
      <select class="field" name="kind" aria-label="${t('ctlType')}">${['playlist','reading','watch','mixed'].map(k => `<option value="${k}">${t('k_' + k)}</option>`).join('')}</select><button class="btn primary" type="submit">${t('createList')}</button></form>`;
    body += S.lists.length ? S.lists.map(l => `<div class="listcard"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><span class="tkind">${t('k_' + l.kind)}</span><h3>${esc(l.name)}</h3></div>
      <button class="btn ghost" data-act="dellist" data-id="${l.id}">${confirmKey === 'list:' + l.id ? t('confirmDelete') : t('deleteList')}</button></div>
      ${l.items.length ? `<ol>${l.items.filter(id => BY_ID[id]).map(id => `<li><div style="display:flex;justify-content:space-between;gap:10px;align-items:start">${ttl(BY_ID[id])}<button class="btn ghost" data-act="rmlist" data-id="${l.id}" data-item="${id}">${t('remove')}</button></div></li>`).join('')}</ol>` : `<p class="note">${t('listEmpty')}</p>`}</div>`).join('') : '';
  } else {
    body = !S.history.length ? `<div class="empty">${t('histEmpty')}</div>` : `<div class="rows">${S.history.map((h,i) => `<div class="row"><div><span class="lbl">${new Intl.DateTimeFormat(LOCALE[S.ui], { dateStyle:'medium', timeStyle:'short' }).format(new Date(h.at))}</span>
      <div style="margin-top:4px"><b>${esc(L(WEATHER[h.weather] || {}))}</b> · ${h.moods.map(m => esc(L(MOODS[m]))).join(', ') || '—'}</div></div>
      <div class="meta">${h.ids.filter(id => BY_ID[id]).slice(0,5).map(id => esc(BY_ID[id].title)).join(' · ')}</div>
      <div class="row-ctl"><button class="btn" data-act="reapply" data-v="${i}">${t('reapply')}</button></div></div>`).join('')}</div>`;
  }
  return `<div class="pagehead"><h1>${t('colTitle')}</h1><p class="hint">${t('guest')}</p></div><div class="tabs" role="tablist">${tabs}</div>${body}`;
}

/* ── Settings ──────────────────────────────────────────────── */
function settingsHtml(){
  const used = [...new Set(CATALOGUE.map(x => x.lang))].filter(c => c !== 'zxx' && c !== 'mul').sort((a,b) => langName(a).localeCompare(langName(b)));
  const langChips = key => `<div class="chips" role="group">${used.map(c => `<button class="chip" data-act="langpref" data-k="${key}" data-v="${c}" data-fk="${key}-${c}" aria-pressed="${S[key].includes(c)}">${esc(langName(c))}</button>`).join('')}</div>`;
  const genres = [...new Set(CATALOGUE.map(x => x.genre || x.form))].sort();
  const w = S.weights, tot = Object.values(w).reduce((a,b) => a+b, 0) || 1;
  const wrow = k => `<div class="wrow"><label for="w-${k}">${t('w_' + k)}</label><input type="range" id="w-${k}" min="0" max="60" step="1" value="${w[k]}" data-in="w:${k}"><output for="w-${k}">${nf(Math.round(w[k]/tot*100))}%</output></div>`;
  return `<div class="pagehead"><h1>${t('setTitle')}</h1></div><div class="settings">
    <div class="card"><h2>${t('uiLang')}</h2><div class="seg" role="group">${UI_LANGS.map(l => `<button data-act="ui" data-v="${l.code}" aria-pressed="${S.ui === l.code}" lang="${l.code}">${l.label}</button>`).join('')}</div>
      <div class="sub"><span class="lbl">${t('titleMode')}</span><div class="chips" role="group">${['all','original','translit','translation'].map(k => `<button class="chip" data-act="titlemode" data-v="${k}" aria-pressed="${S.titleMode === k}">${t('tm_' + k)}</button>`).join('')}</div></div>
      <div class="sub"><span class="lbl">${t('theme')}</span><div class="seg" role="group" style="margin-top:6px">${['system','light','dark'].map(k => `<button data-act="theme" data-v="${k}" aria-pressed="${S.theme === k}">${t('th_' + k)}</button>`).join('')}</div></div></div>
    <div class="card"><h2>${t('weights')}</h2>${['mood','weather','pref','season','time','disc'].map(wrow).join('')}<p class="note">${t('weightsNote')}</p><button class="btn" data-act="resetw" style="margin-top:10px">${t('resetWeights')}</button></div>
    <div class="card"><h2>${t('prefLangs')}</h2>${langChips('prefLangs')}<div class="sub"><span class="lbl">${t('understood')}</span>${langChips('understood')}</div></div>
    <div class="card"><h2>${t('discoverLangs')}</h2>${langChips('discover')}<div class="sub"><span class="lbl">${t('hideLangs')}</span>${langChips('hiddenLangs')}</div></div>
    <div class="card"><h2>${t('hideGenres')}</h2><div class="chips" role="group">${genres.map(g => `<button class="chip" data-act="hidegenre" data-v="${esc(g)}" aria-pressed="${S.hiddenGenres.includes(g)}">${esc(g)}</button>`).join('')}</div></div>
    <div class="card"><h2>${t('linkPolicy')}</h2><p class="prose">${t('linkPolicyText')}</p><h2 style="margin-top:16px">${t('about')}</h2><p class="prose">${t('aboutText')}</p></div>
    <div class="card"><h2>${t('data')}</h2><p class="prose">${t('guest')} ${t('privacy')}</p><button class="btn" data-act="cleardata" style="margin-top:12px">${confirmKey === 'clear' ? t('clearConfirm') : t('clearData')}</button></div>
  </div>`;
}

/* ── Render loop ───────────────────────────────────────────── */
function applyTheme(){
  const r = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark'){ r.dataset.theme = S.theme; r.dataset.mkTheme = '1'; }
  else if (r.dataset.mkTheme){ delete r.dataset.theme; delete r.dataset.mkTheme; }
}
function renderMain(){
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  document.documentElement.lang = S.ui;
  applyTheme(); renderHeader();
  const v = view(), m = $('#main');
  m.innerHTML = v === 'home' ? homeHtml() : VIEW_TYPE[v] ? catHtml(v) : v === 'evening' ? eveningHtml() : v === 'collection' ? collectionHtml() : settingsHtml();
  $('#foot').innerHTML = `<div class="wrap"><span><b lang="bn">মেঘকবিতা</b> · ${esc(t('tagline'))}</span><span>${nf(CATALOGUE.length)} · ${TYPES.map(k => t('t_' + k) + ' ' + nf(CATALOGUE.filter(x => x.t === k).length)).join(' · ')} · <a href="#settings">${t('linkPolicy')}</a></span></div>`;
  const sky = $('#sky'); if (sky){ applySkyVars(sky); startSky(); } else cancelAnimationFrame(skyRAF);
  if (fk){ const el = document.querySelector(`[data-fk="${fk}"]`); if (el) el.focus({ preventScroll:true }); }
}
let toastT = 0;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
function refreshDialog(){ const d = $('#dlg'); if (d.open && d.dataset.id) openItem(d.dataset.id); }

/* ── Actions ───────────────────────────────────────────────── */
function toggleSave(id){
  const it = BY_ID[id];
  if (S.saved[id]){ delete S.saved[id]; toast(t('toastRemoved')); }
  else { S.saved[id] = { at:Date.now(), moods:S.moods.slice(), weather:S.weather, rating:0, status: it.t === 'book' ? 'planned' : it.t === 'movie' ? 'watchlist' : '' }; toast(t('toastSaved')); }
}
function rate(id, n){
  if (!S.saved[id]) toggleSave(id);
  const it = BY_ID[id], prev = S.saved[id].rating || 3, d = n - prev;
  S.saved[id].rating = n;
  const bump = (k, v) => { S.affinity[k] = Math.max(-6, Math.min(6, (S.affinity[k] || 0) + v)); };
  bump('g:' + it.genre, d); bump('l:' + it.lang, d); bump('t:' + it.t, d*0.5);
  toast(t('toastRated'));
}
function readMood(text){
  const found = new Set();
  MOOD_WORDS.forEach(([re, ms]) => { if (re.test(text)) ms.forEach(m => found.add(m)); });
  if (!found.size){ S.readout = t('readNone'); return; }
  S.moods = [...found].slice(0, 4);
  S.readout = `${t('readAs')}: ${S.moods.map(m => L(MOODS[m])).join(', ')}`;
}
function surprise(){
  const pickN = (arr, n) => arr.slice().sort(() => Math.random() - 0.5).slice(0, n);
  S.moods = pickN(MOOD_KEYS, 1 + Math.round(Math.random()));
  S.seed = (S.seed || 0) + 1 + Math.floor(Math.random()*50);
  S.readout = `${t('toastSurprise')}: ${S.moods.map(m => L(MOODS[m])).join(' + ')}`;
  toast(S.readout);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  let rerender = true, keepConfirm = false;
  switch (a){
    case 'open': e.preventDefault(); openItem(id); rerender = false; break;
    case 'close': $('#dlg').close(); rerender = false; break;
    case 'save': toggleSave(id); refreshDialog(); break;
    case 'unsave': delete S.saved[id]; toast(t('toastRemoved')); break;
    case 'rate': rate(id, +v); refreshDialog(); break;
    case 'ui': S.ui = v; break;
    case 'sky': S.weather = v; S.weatherAuto = false; S.exploring = !!live; break;
    case 'backlive': if (live){ S.weather = live.cat; S.exploring = false; } break;
    case 'locate': locate(); rerender = false; break;
    case 'mood': S.moods = S.moods.includes(v) ? S.moods.filter(x => x !== v) : [...S.moods, v]; S.readout = ''; break;
    case 'int': S.intensity = +v; break;
    case 'surprise': surprise(); break;
    case 'clearmoods': S.moods = []; S.readout = ''; S.freeText = ''; break;
    case 'more': F[view()].page++; break;
    case 'resetf': F[view()] = null; break;
    case 'tomood': if (view() === 'home'){ e.preventDefault(); $('#mood')?.scrollIntoView({ behavior:'smooth' }); } else toMood = true; rerender = false; break;
    case 'eve': S.eve[b.dataset.k] = isNaN(+v) ? v : +v; if (b.dataset.k === 'intensity') S.intensity = +v; break;
    case 'buildeve': runEvening(!!evePlan); break;
    case 'coltab': S.colTab = v; break;
    case 'dellist': if (confirmKey === 'list:' + id){ S.lists = S.lists.filter(l => l.id !== id); confirmKey = null; } else { confirmKey = 'list:' + id; keepConfirm = true; } break;
    case 'rmlist': { const l = S.lists.find(x => x.id === id); if (l) l.items = l.items.filter(x => x !== b.dataset.item); } break;
    case 'reapply': { const h = S.history[+v]; if (h){ S.weather = h.weather; S.moods = h.moods.slice(); S.intensity = h.intensity; S.weatherAuto = false; S.exploring = !!live; location.hash = '#home'; } } break;
    case 'titlemode': S.titleMode = v; break;
    case 'theme': S.theme = v; break;
    case 'langpref': { const k = b.dataset.k; S[k] = S[k].includes(v) ? S[k].filter(x => x !== v) : [...S[k], v]; } break;
    case 'hidegenre': S.hiddenGenres = S.hiddenGenres.includes(v) ? S.hiddenGenres.filter(x => x !== v) : [...S.hiddenGenres, v]; break;
    case 'resetw': S.weights = { ...WEIGHTS_DEFAULT }; break;
    case 'cleardata': if (confirmKey === 'clear'){ const ui = S.ui; S = fresh(); S.ui = ui; S.weather = pickDefaultSky(); try { localStorage.removeItem(KEY); } catch(_){} confirmKey = null; toast(t('toastCleared')); } else { confirmKey = 'clear'; keepConfirm = true; } break;
    default: rerender = false;
  }
  if (!keepConfirm) confirmKey = null;
  if (rerender){ persist(); renderMain(); if (a === 'ui') refreshDialog(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, q = (new FormData(f).get('q') || '').toString();
  if (k === 'city') searchCity(q);
  else if (k === 'free'){ S.freeText = q; readMood(q); persist(); renderMain(); }
  else if (k === 'newlist'){ const fd = new FormData(f), name = (fd.get('name') || '').toString().trim(); if (!name) return;
    S.lists.push({ id:'l' + Date.now().toString(36), name, kind:fd.get('kind'), items:[] }); persist(); renderMain(); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.ch; if (!k) return;
  if (k === 'ctlLang') S.ctlLang = el.value;
  else if (k === 'ctlType') S.ctlType = el.value;
  else if (k === 'ctlTime') S.ctlTime = +el.value;
  else if (k === 'sky'){ S.weather = el.value; S.weatherAuto = false; S.exploring = !!live; }
  else if (k.startsWith('f:')){ const v = view(); F[v][k.slice(2)] = el.value; F[v].page = 1; }
  else if (k === 'status'){ const id = el.dataset.id; if (!S.saved[id]) toggleSave(id); S.saved[id].status = el.value; }
  else if (k === 'addlist'){ const l = S.lists.find(x => x.id === el.value); const id = el.dataset.id; if (l && !l.items.includes(id)){ l.items.push(id); toast(t('added') + ': ' + l.name); } persist(); refreshDialog(); return; }
  else if (k === 'eveinc'){ S.eve.inc[el.dataset.k] = el.checked; }
  persist(); renderMain(); if (k === 'status') refreshDialog();
});
let inT = 0;
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === 'f:q'){ const v = view(); F[v].q = el.value; F[v].page = 1; clearTimeout(inT); inT = setTimeout(() => { renderMain(); const i = document.getElementById(el.id); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 220); }
  else if (k.startsWith('w:')){ S.weights[k.slice(2)] = +el.value; persist(); const tot = Object.values(S.weights).reduce((a,b) => a+b, 0) || 1;
    document.querySelectorAll('.wrow').forEach(r => { const i = r.querySelector('input'), o = r.querySelector('output'); o.textContent = nf(Math.round(S.weights[i.id.slice(2)]/tot*100)) + '%'; }); }
});
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
let toMood = false;
window.addEventListener('hashchange', () => { if ($('#dlg').open) $('#dlg').close(); renderMain(); window.scrollTo(0, 0); if (toMood){ toMood = false; $('#mood')?.scrollIntoView(); } });
setInterval(() => { if (view() === 'home'){ const p = document.querySelector('.sky-place span:last-child'); if (p){ const now = cityNow(); p.textContent = new Intl.DateTimeFormat(LOCALE[S.ui], { weekday:'long', day:'numeric', month:'long' }).format(now) + ' · ' + new Intl.DateTimeFormat(LOCALE[S.ui], { hour:'numeric', minute:'2-digit' }).format(now) + (live ? '' : ' (' + t('deviceTime') + ')'); } } }, 30000);

renderMain();
if (S.city) fetchLive(S.city);
})();
</script>

</body></html>
